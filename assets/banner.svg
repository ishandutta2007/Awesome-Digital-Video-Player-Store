<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#1a102f"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #d1d5db;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #ffffff;
    }
    
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(25px, -30px); }
      100% { transform: translate(0px, 0px); }
    }

    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(-30px, 20px); }
      100% { transform: translate(0px, 0px); }
    }

    @keyframes wavePass {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes spinDisc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animated-orb1 {
      animation: floatOrb1 10s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-orb2 {
      animation: floatOrb2 12s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-wave {
      stroke-dasharray: 50 10;
      animation: wavePass 25s linear infinite;
    }
    .spinning-disc {
      animation: spinDisc 20s linear infinite;
      transform-origin: 1020px 200px;
    }
  </style>

  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <g class="animated-orb1" opacity="0.4">
    <circle cx="200" cy="100" r="180" fill="#8a2be2" filter="url(#glow)"/>
  </g>
  <g class="animated-orb2" opacity="0.35">
    <circle cx="1000" cy="300" r="220" fill="#ff2a85" filter="url(#glow)"/>
  </g>

  <path class="animated-wave" d="M-100,320 C200,380 400,220 700,340 C1000,460 1100,250 1300,300" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.3"/>
  <path class="animated-wave" d="M-100,280 C250,180 450,320 800,200 C1050,100 1150,220 1300,180" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.25"/>

  <g class="spinning-disc" opacity="0.15">
    <circle cx="1020" cy="200" r="160" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 15"/>
    <circle cx="1020" cy="200" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="4"/>
    <circle cx="1020" cy="200" r="80" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="5 10"/>
  </g>

  <rect x="860" y="80" width="240" height="240" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" backdrop-filter="blur(10px)"/>
  
  <g filter="url(#softGlow)">
    <circle cx="980" cy="200" r="48" fill="url(#accentGrad)"/>
    <polygon points="968,180 1002,200 968,220" fill="#ffffff"/>
  </g>

  <g transform="translate(80, 75)">
    <rect width="280" height="32" rx="16" fill="rgba(255, 42, 133, 0.15)" stroke="#ff2a85" stroke-width="1.5"/>
    <text x="140" y="21" text-anchor="middle" class="badge-text" fill="#ff79b8">🎬 CURATED MEDIA ECOSYSTEM</text>
  </g>

  <text x="80" y="155" class="title">
    Awesome Digital Video
  </text>
  <text x="80" y="210" class="title" fill="url(#accentGrad)">
    Player &amp; Store
  </text>

  <text x="80" y="260" class="subtitle">
    Top SaaS Video Storefronts &amp; Open-Source Media Servers
  </text>

  <g transform="translate(80, 298)">
    <g transform="translate(0,0)">
      <rect width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text x="70" y="22" text-anchor="middle" class="badge-text">🍿 SaaS VOD</text>
    </g>

    <g transform="translate(152,0)">
      <rect width="170" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text x="85" y="22" text-anchor="middle" class="badge-text">🚀 Media Servers</text>
    </g>

    <g transform="translate(334,0)">
      <rect width="170" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text x="85" y="22" text-anchor="middle" class="badge-text">⚡ Video Players</text>
    </g>

    <g transform="translate(516,0)">
      <rect width="150" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" class="badge-text">🏠 Self-Hosted</text>
    </g>
  </g>

  <rect x="0" y="394" width="1200" height="6" fill="url(#accentGrad)" rx="3"/>
</svg>
